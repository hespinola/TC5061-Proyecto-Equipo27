# Entorno del MLflow Project (MLproject).
# Mismas versiones fijas que tec-mlops-equipo-27/requirements.txt; la prueba
# tests/test_mlproject.py falla si dejan de coincidir. El paquete mibici no se
# instala: los comandos del MLproject se ejecutan dentro de tec-mlops-equipo-27/.
python: "3.13"
build_dependencies:
  - pip
dependencies:
  - loguru==0.7.3
  - matplotlib==3.11.2
  - mkdocs==1.6.1
  - mlflow==3.17.1
  - numpy==2.5.4
  - pandas==3.0.6
  - pyarrow==25.0.1
  - python-dotenv==1.2.4
  - requests==2.34.2
  - ruff==0.17.1
  - scikit-learn==1.9.1
  - tqdm==4.70.1
  - typer==0.27.3
  - pytest==9.2.0
