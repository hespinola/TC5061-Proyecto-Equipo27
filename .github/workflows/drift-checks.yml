name: Drift checks

on:
  pull_request:
    paths:
      - ".github/workflows/drift-checks.yml"
      - "python_env.yaml"
      - "tec-mlops-equipo-27/requirements.txt"
      - "tec-mlops-equipo-27/mibici/**"
      - "tec-mlops-equipo-27/tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/drift-checks.yml"
      - "python_env.yaml"
      - "tec-mlops-equipo-27/requirements.txt"
      - "tec-mlops-equipo-27/mibici/**"
      - "tec-mlops-equipo-27/tests/**"

permissions:
  contents: read

jobs:
  drift-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tec-mlops-equipo-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test trip monitoring
        run: python -m unittest discover -s tests -p 'test_drift.py' -v
      - name: Test P1 monitoring and Evidently integration
        run: python -m unittest discover -s tests -p 'test_monitoreo_p1.py' -v
      - name: Test offline A/B and temporary Model Registry
        run: python -m pytest tests/test_ab_testing.py -q
