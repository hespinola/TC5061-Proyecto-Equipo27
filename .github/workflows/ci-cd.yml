name: CI/CD

# Entregable 7 · Parte 2: en cada push a main y en cada pull request se ejecutan
# las pruebas, se construye la imagen del servicio y se levanta el sistema completo
# (MLflow + API) con docker-compose.yml para verificar que responde.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Pruebas: matriz por grupo de pruebas, en paralelo
  # ---------------------------------------------------------------------------
  pruebas:
    name: Pruebas (${{ matrix.grupo }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: api
            args: tests/test_api.py tests/test_api_contract.py
          - grupo: datos y monitoreo
            args: >-
              tests/test_dataset.py tests/test_validacion_datos.py
              tests/test_features.py tests/test_feature_engineering.py
              tests/test_procesamiento_datos.py tests/test_drift.py
              tests/test_monitoreo_p1.py
          # Todo lo demás (incluye cualquier archivo de pruebas nuevo)
          - grupo: modelado y registry
            args: >-
              tests
              --ignore=tests/test_api.py --ignore=tests/test_api_contract.py
              --ignore=tests/test_dataset.py --ignore=tests/test_validacion_datos.py
              --ignore=tests/test_features.py --ignore=tests/test_feature_engineering.py
              --ignore=tests/test_procesamiento_datos.py --ignore=tests/test_drift.py
              --ignore=tests/test_monitoreo_p1.py
    defaults:
      run:
        working-directory: tec-mlops-equipo-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Caché de dependencias: reutiliza las descargas de pip entre corridas
          cache: pip
          cache-dependency-path: tec-mlops-equipo-27/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Ejecutar pruebas
        run: python -m pytest ${{ matrix.args }} -q -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # 2. Imagen + despliegue con Compose: construye la imagen, levanta MLflow y la
  #    API, y verifica /health y /predict/demanda dentro del runner
  # ---------------------------------------------------------------------------
  imagen-y-compose:
    name: Imagen y despliegue con Compose
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tec-mlops-equipo-27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tec-mlops-equipo-27/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # modelo_p1/ no se versiona y el Containerfile lo necesita. En CI no existe el
      # registry del equipo, así que se genera el modelo de demostración (misma firma).
      - name: Preparar modelo_p1 (demostración)
        run: python scripts/modelo_demo.py --destino modelo_p1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tec-mlops-equipo-27
          file: tec-mlops-equipo-27/Containerfile
          tags: localhost/mibici-api:1.0.0
          load: true
          push: false
          # Caché de capas de Docker entre corridas
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Levantar MLflow + API con Compose
        run: docker compose -f docker-compose.yml up -d --no-build --wait --wait-timeout 240

      - name: Verificar servicios
        run: |
          set -euo pipefail
          mkdir -p evidencia
          docker compose -f docker-compose.yml ps | tee evidencia/compose-ps.txt

          curl --fail-with-body -sS http://127.0.0.1:5000/health | tee evidencia/mlflow-health.txt
          echo

          curl --fail-with-body -sS http://127.0.0.1:8000/health | tee evidencia/api-health.json
          echo
          python -c "import json,sys; d=json.load(open('evidencia/api-health.json')); sys.exit(d['estado']!='ok')"

          curl --fail-with-body -sS http://127.0.0.1:8000/predict/demanda \
            -H 'Content-Type: application/json' \
            --data-binary @examples/predict-demanda.json | tee evidencia/prediccion.json
          echo
          python -c "import json; p=json.load(open('evidencia/prediccion.json'))['predicciones']; assert len(p)==1 and p[0]['salidas_esperadas']>=0"

          # Una entrada inválida debe responder 422
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/predict/demanda \
            -H 'Content-Type: application/json' -d '{"instancias": []}')
          echo "Entrada vacía -> HTTP $codigo"
          test "$codigo" = "422"

          docker stats --no-stream --format \
            'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' | tee evidencia/docker-stats.txt

      - name: Resumen
        if: success()
        run: |
          {
            echo "## Despliegue con Compose verificado"
            echo
            echo "MLflow y la API quedaron *healthy*; \`/predict/demanda\` respondió 200 y una entrada vacía, 422."
            echo
            echo '```'
            cat evidencia/docker-stats.txt
            echo '```'
            echo
            echo "_Imagen construida con el modelo de demostración (\`scripts/modelo_demo.py\`)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs de los servicios
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidencia-compose
          path: tec-mlops-equipo-27/evidencia/
          if-no-files-found: ignore

      - name: Detener servicios
        if: always()
        run: docker compose -f docker-compose.yml down -v
