# Nombre del proyecto en Podman Compose (agrupa contenedores, red y volúmenes)
name: mibici-equipo27

# Ambos servicios comparten la imagen construida con el Containerfile original
x-imagen: &imagen
  build:
    context: .
    dockerfile: Containerfile
  image: localhost/mibici-api:1.0.0

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Servidor de seguimiento y registro de modelos (MLflow)
  # ----------------------------------------------------------------------------
  mlflow:
    # Hereda la configuración de build e imagen definida en &imagen
    <<: *imagen
    container_name: mibici-mlflow
    # En Podman rootless equivale a tu usuario local y evita errores de permisos
    # al escribir en el volumen /mlflow
    user: "0:0"
    # Sobrescribe el CMD de Containerfile para iniciar el servidor web de MLflow
    command:
      - python
      - -m
      - mlflow
      - server
      # Base de datos SQLite para experimentos, métricas y Model Registry
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      # Directorio interno donde se almacenan los artefactos de los modelos
      - --artifacts-destination
      - /mlflow/mlartifacts
      # Habilita la descarga de artefactos vía HTTP desde el servidor MLflow
      - --serve-artifacts
      # Escucha en todas las interfaces de red dentro del contenedor
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      # Un solo worker evita bloqueos en SQLite y reduce el consumo de RAM
      - --workers
      - "1"
      # Lista blanca de cabeceras Host aceptadas por MLflow 3
      - --allowed-hosts
      - "mlflow:5000,mlflow,127.0.0.1:5000,localhost:5000"
    # Expone la interfaz web de MLflow en http://127.0.0.1:5000
    ports:
      - "5000:5000"
    # Persiste la base SQLite y los artefactos en un volumen administrado por Podman
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
    # Verifica que MLflow responda HTTP 200 antes de marcarlo como saludable
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Reinicia el contenedor automáticamente salvo que se detenga manualmente
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Servicio 2: API REST de inferencia (FastAPI / Uvicorn)
  # ----------------------------------------------------------------------------
  api:
    # Reutiliza exactamente la misma imagen que el servicio mlflow
    <<: *imagen
    container_name: mibici-api
    # No definimos MODELO_NOMBRE ni MODELO_ALIAS para que use /opt/models/p1/
    # ya copiado dentro de Containerfile.
    # Expone la API en http://127.0.0.1:8000 (/docs y /health)
    ports:
      - "8000:8000"
    # Espera a que el healthcheck de mlflow sea exitoso antes de arrancar
    depends_on:
      mlflow:
        condition: service_healthy
    # Comprueba que el endpoint /health de la API responda HTTP 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped

# Declaración del volumen persistente administrado por Podman
volumes:
  mlflow_store: